name: check
on:
  push:
    branches: [main]
  pull_request:
    # Spelt out because the default set is opened, synchronize and reopened —
    # and `edited` is not in it. Retargeting a pull request onto another base
    # fires `edited` and nothing else, so no fresh check started and the green
    # already attached to the head survived the move. That is half of a route
    # found on #34: open a head against a base that already carries the change
    # being judged, get it cleared against that innocent comparison, then
    # retarget to main and merge on a green nobody re-earned. THE OTHER HALF IS
    # NOT HELD. review-gate.py's verdict reads the head commit's check runs and
    # nothing about the base, and review.yml diffs against the pull request's
    # base at the moment of the ask, so a head read clean against another base
    # stays clean after the retarget. While the gate still counted Codex it
    # re-read the changed files to decide whether a change needed Codex's read,
    # and that held nothing either: Codex could be asked before the retarget
    # too. What closes it is the reviewer reading against main's tip, a gate
    # change of its own. Meanwhile this trigger re-runs the check so its note
    # reads the files the pull request now carries.
    # `ready_for_review` was here too and is not, because it repaired nothing:
    # a draft already gets its `opened` run, so marking an unchanged head ready
    # adds an invocation rather than starting a check that was missing. The
    # evidence was for `edited` and I extended it by analogy, which is an
    # addition and needs the gate. Only `edited` is added, and only because a
    # retarget demonstrably left a stale green standing.
    # `edited` also fires on a title or description edit, which re-runs the
    # gate for nothing. That is the cheap direction: the run takes seconds and
    # always answers correctly, while the alternative is a state change that
    # silently keeps a stale green.
    types: [opened, synchronize, reopened, edited]
  # THE WAKE AND TWO TRIGGERS WENT WITH CODEX, on his ruling of 22 September 2026.
  #
  # `issue_comment` was here because Codex's clean pass arrived as a comment and a
  # comment starts nothing on the pull request's head, so a green review needed a
  # hand re-run to be seen. The job under it listened for that one login, and
  # review-gate.py refuses a line here that listens for a login the gate does not
  # count — which, with Codex off the register, is every login. Both are gone
  # rather than pointed at somebody else.
  #
  # `pull_request_review` was here for the other half of Codex's voice: findings
  # arrived as a submitted review. review-gate.py no longer reads a submitted
  # review at all, so that trigger could only start a run that re-reads the same
  # check runs and reaches the same answer — the "re-run that can never change the
  # answer" the wiring check calls a fault when it is a login. It is the same
  # fault as a trigger, so it goes the same way.
  #
  # NOTHING IS LEFT UNWOKEN BY THIS. The badge's verdict is a check run, and
  # review.yml calls wake.yml itself the moment after it posts — which is not a
  # habit but a line review-gate.py refuses a build without (`CALLS_WAKE`).
permissions:
  contents: read
  pull-requests: read
  # The gate reads the badge's check run on the head commit. Without this the
  # fetch is a 403 and every pull request reads as unread; review-gate.py's
  # wiring check refuses a build that drops it.
  checks: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash check.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
