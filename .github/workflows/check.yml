name: check
on:
  push:
    branches: [main]
  pull_request:
    # Spelt out because the default set is opened, synchronize and reopened —
    # and `edited` is not in it. Retargeting a pull request onto another base
    # fires `edited` and nothing else, so no fresh check started and the green
    # already attached to the head survived the move. That is half of a route
    # found on #34: open a head against a base that already carries the change
    # being judged, get it cleared against that innocent comparison, then
    # retarget to main and merge on a green nobody re-earned. The gate's own
    # half — judging against the protected branch's tip rather than the pull
    # request's base — is in review-gate.py; this is the half that makes the
    # check run again at all.
    # `ready_for_review` was here too and is not, because it repaired nothing:
    # a draft already gets its `opened` run, so marking an unchanged head ready
    # adds an invocation rather than starting a check that was missing. The
    # evidence was for `edited` and I extended it by analogy, which is an
    # addition and needs the gate. Only `edited` is added, and only because a
    # retarget demonstrably left a stale green standing.
    # `edited` also fires on a title or description edit, which re-runs the
    # gate for nothing. That is the cheap direction: the run takes seconds and
    # always answers correctly, while the alternative is a state change that
    # silently keeps a stale green.
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted]
  # A clean pass arrives as a comment, and a comment starts nothing on the pull
  # request's head — which is why a green review has needed a hand re-run to be
  # seen. The reviewer also edits its summary comment when a review finishes, so
  # both shapes are listened for.
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  wake:
    # Only a reviewer's own comment, only on a pull request, and nothing else:
    # it asks the gate again so it can see the review that has just landed. The
    # work is in .github/workflows/wake.yml, which review.yml calls too — one
    # implementation, so the next lesson about which run a protected branch
    # actually reads is learned once.
    #
    # ONLY CODEX IS LISTENED FOR HERE, AND THAT IS NOT AN OVERSIGHT. GitHub
    # starts no workflow run for an event caused by the repository's own token,
    # so a comment the Sonnet reviewer posts raises nothing a listener could
    # hear. A line for github-actions[bot] would read like a guarantee and never
    # fire once; review.yml calls the wake itself instead, and review-gate.py
    # refuses either mistake — a reviewer with no wake at all, or a dead line
    # here pretending to be one.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    # The write is for one call — re-running this pull request's own check — and
    # belongs to this job alone. The check job executes the proposed tree's
    # check.sh and must never hold it.
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/wake.yml
    with:
      pr: ${{ github.event.issue.number }}

  check:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash check.sh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
