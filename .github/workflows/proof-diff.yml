name: proof-diff
# A throwaway proof for #64, run once from this branch and deleted with it.
# It repeats review.yml's checkout and its new diff line exactly, in the real
# runner, and stages #34's route: this commit (C) is on a side branch and not
# on main, and the next commit (D) is the change a reviewer would be asked about.
on:
  push:
    branches: ['proof/diff-against-main']
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The new line, exactly as review.yml runs it
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "event $GITHUB_EVENT_NAME, ref $GITHUB_REF, head $SHA"
          echo "origin/${{ github.event.repository.default_branch }} resolves to $(git rev-parse "origin/${{ github.event.repository.default_branch }}")"
          git diff "origin/${{ github.event.repository.default_branch }}...${SHA}" > /tmp/diff.txt
          echo "diff bytes: $(wc -c < /tmp/diff.txt)"
          echo "--- against main's tip (the new line): files in front of the reviewer"
          git diff --name-only "origin/${{ github.event.repository.default_branch }}...${SHA}"
          echo "--- against the side branch as base (the old comparison): files in front of the reviewer"
          git diff --name-only "${SHA}~1...${SHA}"
          echo "--- and the brief line three below it, unchanged, still resolves"
          echo "brief bytes: $(git show "origin/${{ github.event.repository.default_branch }}:AGENTS.md" | wc -c)"
