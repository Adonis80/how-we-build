name: Build the Roadmap
run-name: Build the Roadmap (${{ github.event_name }})

# THE ROADMAP'S FRAME, DEPLOYED ONLY WHEN ITS OWN CODE CHANGES (#222, his
# ruling, 15 October 2026: the Roadmap "must not use deploys, use resources, or
# compete with a real product"). It deploys board/'s PIN gate and board/build.py,
# as the function api/build.py, to the Vercel project juku-build-board, and reads
# nothing: each time the page is opened, the function reads every product's
# roadmap.json, this repository's pull requests and OpenRouter's spend there and
# then, with the project's own read-only keys. No pull request, verdict, product
# or clock wakes this: a push to main that changes the Roadmap's code, or a dispatch.
# review-gate.py holds this file: its triggers, its door, its read-only token, and
# that it carries no App key.
#
# THE DOMAIN MOVES ONLY TO A COPY OF WHAT THIS STEP SMOKED (#117's second read, 1). It
# makes a preview, which the host never gives the domain; smokes it as a
# stranger; and only then asks for a production copy of those same files,
# since the host will not promote a preview, which the host gives the domain
# once ready; then it smokes the domain. A copy asked for whose answer is lost
# is not known to this step and may still land (#139's read, 2b), as may a
# READY copy the host gives the domain after the minute it is waited for.
# Every other red after the promote puts back what the domain served before,
# but a copy whose cancel is refused or unconfirmed, red in its own words; a
# preview that never came ready is cancelled, one that failed its smoke is
# deleted. review-gate.py runs this step against a fake host, path by path.
#
# A PUSH MOVES IT ONLY WHEN THE FRAME CHANGED: when what the domain serves
# carries this frame's fingerprint in board.sha and shows a stranger the PIN
# screen alone, nothing is deployed (shown on 15 October 2026 for the page it
# replaced: run 38480903245, attempt 5, `unchanged:`).
#
# NOTHING IS DEPLOYED ONCE THE ACCOUNT HAS MADE 60 IN 24 HOURS (his ask, 15
# October 2026), so the Roadmap can never starve a product of the host's 100,
# unless a production run finds a stranger shown the Roadmap, whose replacement
# passes over it. Run 38729496353 (15 October 2026), the first after its merge,
# read the count and went on under it; a run held at the ceiling is not yet seen.
#
# THIS LOG IS PUBLIC. Nothing a key or a product holds is printed: conclusions
# only. No artifact is uploaded and no run summary written, because a public
# repository's are public too.

on:
  workflow_dispatch:
    inputs:
      target:
        description: preview, a look first; production, the Roadmap itself, once LIVE is yes.
        required: true
        # A preview unless production is chosen (#117's second read, 7).
        default: preview
        type: choice
        options:
          - production
          - preview
  # The Roadmap's own code, merged: nothing else that lands on main moves it (#222).
  push:
    branches: [main]
    paths:
      - board/**
      - .github/workflows/build-board.yml

# Read, and nothing else: review-gate.py refuses a `write` (#117's second read, 5).
permissions:
  contents: read

# Production waits for his look at the first preview (step 6): a preview
# dispatch deploys either way, short of the deploy step's ceiling; production, dispatched or automatic, only once
# this reads yes, which one reviewed line flips after he has agreed.
env:
  LIVE: "yes"

jobs:
  build:
    # Main's own file and tree alone; the door below admits nothing else either.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One at a time, and none cancelled: a deploy is never cut off between
    # going live and its smoke test. On the job, not the workflow (#113's first read). Held there.
    concurrency:
      group: build-board
      cancel-in-progress: false
    # THE DOOR. The deploy key and the Roadmap's two read keys are readable only
    # from main. review-gate.py refuses a build that loses it.
    environment: reviewer
    # The deploy's waits end at minute `limit` of this, so a rollback begun at
    # the last moment keeps its three minutes inside it.
    timeout-minutes: 15
    env:
      TEAM: team_B8AXqxDb20T9DrXElAAXsvgF
      PROJECT: prj_Y61u57bV01hn4UAhVS1GSeTNlIca
      DOMAIN: roadmap.juku.pro
      # One address for every preview (his ask, 1 October 2026): the newest smoked
      # preview takes this name, so there is one link to open, never a new one.
      NEXT: juku-build-board-next.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          # No token left in .git for a later step to find; held.
          persist-credentials: false

      - name: Start the clock
        id: clock
        # The job's start, which the deploy's deadline counts from (#117's second read, 3).
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Lay out the frame
        id: frame
        run: |
          set -euo pipefail
          # THE FRAME, AND NOTHING READ (#222): the gate's three files, and the
          # Roadmap's build as its function. Its fingerprint is over those four
          # files alone, so only a change to the Roadmap's code deploys it.
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/api"
          cp board/build.py "$site/api/build.py"
          cp board/middleware.js board/robots.txt board/vercel.json "$site/"
          h=$(cat board/build.py board/middleware.js board/robots.txt board/vercel.json | sha256sum | cut -d' ' -f1)
          echo "board_hash=$h" >> "$GITHUB_OUTPUT"
          echo "the frame: $(wc -c < board/build.py) bytes of build, the gate's three files"

      - name: Deploy, smoke, and roll back on red
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # A dispatch's own target, empty included, so the case below refuses
          # anything but the two (#117's third read, 7); never production by default.
          TARGET: ${{ github.event_name != 'workflow_dispatch' && 'production' || inputs.target }}
          STARTED: ${{ steps.clock.outputs.started }}
          BOARD_HASH: ${{ steps.frame.outputs.board_hash }}
          # The function's two keys, carried to the project before the frame is made (#222).
          BOARD_READ_TOKEN: ${{ secrets.BOARD_READ_TOKEN }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
        run: |
          set -euo pipefail
          # HIS LOOK FIRST (step 6). Until LIVE is flipped by a one-line pull
          # request after he has agreed the preview, only a preview is deployed;
          # a push lays out the frame and moves nothing, and a production
          # dispatch is refused (#117's fourth read, 2).
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$LIVE" != yes ]; then
            echo "::notice::rendered, not deployed: automatic deploys begin when LIVE is yes, after the Chairman agrees the look"
            exit 0
          fi
          [ -n "${VERCEL_TOKEN:-}" ] || { echo "::error::No deploy key: the reviewer environment holds no VERCEL_TOKEN. Nothing is deployed; the last Roadmap stands."; exit 1; }
          # A FRAME WITH NOTHING TO READ WITH IS NOT DEPLOYED (#222): until the
          # reviewer environment holds the read key, the Roadmap the domain serves
          # stands as it is, its own time on its first screen.
          if [ -z "${BOARD_READ_TOKEN:-}" ]; then
            echo "::warning::No read key: the reviewer environment holds no BOARD_READ_TOKEN, so the live Roadmap would read nothing. Nothing is deployed; the last Roadmap stands."
            exit 0
          fi
          case "$TARGET" in production|preview) ;; *) echo "::error::no such target"; exit 1 ;; esac
          if [ "$TARGET" = production ] && [ "$LIVE" != yes ]; then
            echo "::error::production waits for his look: LIVE is not yes, so nothing is deployed; dispatch a preview instead."
            exit 1
          fi
          # EVERY REQUEST HAS A TIME LIMIT, AND EVERY WAIT A DEADLINE counted
          # from the job's start (#117's second read, 3): the waits end at
          # minute `limit` of the job, so a rollback begun then still has its
          # three minutes inside the job's timeout.
          limit=9
          [[ "${STARTED:-}" =~ ^[0-9]+$ ]] || { echo "::error::the job's start was not recorded, so nothing could be timed. Nothing is deployed."; exit 1; }
          by=$(( STARTED + limit * 60 ))
          [ $(( by - $(date +%s) )) -ge 120 ] || { echo "::error::too little of the job is left to deploy, smoke and still roll back. Nothing is deployed."; exit 1; }
          v() { curl -sS --max-time 20 -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" "$@"; }
          q="teamId=$TEAM"
          site="$RUNNER_TEMP/site"
          # What a stranger is shown at host $1, at the root, at the old page's
          # name and at the function's own: 0, gated at both; 1, not yet; 2, the board. $2 = wall lets
          # the host's sign-in wall count as gated, which only a preview has:
          # a redirect to the host's own sign-in, and no other, as run
          # 36715901351 found it answering a stranger (#117, 30 September).
          # The page is grepped and never printed.
          gated() {
            local p out last code loc body seen=0
            for p in / /index.html /api/build; do
              out=$(curl -sS --max-time 20 -w '\n%{http_code} %{redirect_url}' "https://$1$p" 2>/dev/null || true)
              last=${out##*$'\n'}
              code=${last%% *}
              loc=${last#* }
              body=${out%$'\n'*}
              if grep -q "data-board" <<< "$body"; then return 2; fi
              case "$code" in
                200) grep -q "Directors only" <<< "$body" || seen=1 ;;
                302|307) { [ "$2" = wall ] && [[ "$loc" == "https://vercel.com/sso-api?"* ]]; } || seen=1 ;;
                *) seen=1 ;;
              esac
            done
            return "$seen"
          }
          # What the domain serves, asked of the host by name.
          serving() { v "https://api.vercel.com/v13/deployments/$DOMAIN?$q" 2>/dev/null | jq -r '.id // empty' 2>/dev/null || true; }
          serves() { local s; s=$(serving); [ -n "$s" ] && [ "$s" = "$1" ]; }
          # The production copy's state, asked of the host.
          copied() { v "https://api.vercel.com/v13/deployments/$copy?$q" 2>/dev/null | jq -r '.readyState // empty' 2>/dev/null || true; }
          # What the domain serves now is recorded before anything moves: what
          # it serves, not what the project calls production (#117's second
          # read, 1).
          before=$(serving)
          [ -n "$before" ] || { echo "::error::what $DOMAIN serves could not be recorded, so there would be nothing to roll back to. Nothing is deployed."; exit 1; }
          echo "serving before: $before"
          # ONLY A CHANGED FRAME IS DEPLOYED BY A PUSH: when what the domain
          # serves was made from the same fingerprint, and shows a stranger the
          # PIN screen alone now, nothing moves. The fingerprint rides as a file,
          # board.sha, whose uid in the host's file tree is the SHA-1 of its
          # bytes (shown on 13 October on robots.txt, vercel.json and
          # middleware.js): the host kept no meta sent with a deployment. It is
          # stamped on a copy before its smoke, so a copy that landed after a red
          # run carries it too: the smoke asked here is what keeps such a copy
          # from being kept (#210's first read). The Roadmap reads live, so it never
          # ages (#222). A dispatch always passes over this, and a live deployment
          # that cannot be read deploys; either is still held by the ceiling below.
          [[ "${BOARD_HASH:-}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the Roadmap's fingerprint was not taken. Nothing is deployed."; exit 1; }
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            was=$(v "https://api.vercel.com/v6/deployments/$before/files?$q" 2>/dev/null \
              | jq -r '[.. | objects | select(.type == "file" and .name == "board.sha") | .uid][0] // empty' 2>/dev/null || true)
            want=$(printf '%s' "$BOARD_HASH" | sha1sum | cut -d' ' -f1)
            if [ "$was" = "$want" ] && gated "$DOMAIN" pin; then
              echo "unchanged: $DOMAIN serves $before, made from this same frame, the PIN screen alone to a stranger. Nothing is deployed."
              exit 0
            fi
          fi
          # A HARD CEILING ON THE HOST'S DAY (his ask, 15 October 2026: "the
          # board counts the account's deploys in the last 24 hours and skips if
          # 60 or more are used, so it can never starve a product"). Before
          # anything is made, the team's deployments in the last 24 hours are
          # counted, every project's: the account has the one team, and every
          # product deploys in it (read 15 October 2026). At 60 or more nothing
          # is deployed, a dispatch and a preview included. It stops a run from
          # starting, so one counted at 59 makes its preview and copy and ends
          # the day at 61. One page of 100 is enough: past 60 the exact number
          # changes nothing. Each is held to the window by its own time, not on
          # the query's word. The count is not printed, since it is the
          # products' deploys too. A day that cannot be counted deploys nothing,
          # red, since the ceiling could not be held. One thing passes over it,
          # on a production run alone: a domain showing a stranger the Roadmap
          # (#219's first read), whose gated replacement is worth a deployment
          # the products would miss. A preview never replaces the domain, so it
          # buys nothing there (#219's second read, 2). Whether the count
          # reached past the Roadmap's own project is said, yes or no (#219's
          # second read, 1): yes shows the key reached the products; no is a
          # quiet day for them or a key that sees the Roadmap alone (#221's read).
          since=$(( ($(date +%s) - 86400) * 1000 ))
          day=$(v "https://api.vercel.com/v6/deployments?$q&since=$since&limit=100" 2>/dev/null || true)
          used=$(printf '%s' "$day" | jq --argjson s "$since" '[.deployments[] | select(.created >= $s)] | length' 2>/dev/null || true)
          [[ "$used" =~ ^[0-9]+$ ]] || { echo "::error::the account's deployments in the last 24 hours could not be counted, so the ceiling could not be held. Nothing is deployed."; exit 1; }
          others=$(printf '%s' "$day" | jq -r --argjson s "$since" \
            'if any(.deployments[]; .created >= $s and .name != "juku-build-board") then "yes" else "no" end' 2>/dev/null || echo unread)
          echo "other projects' deployments among those counted: $others"
          if [ "$used" -ge 60 ]; then
            leak=0
            [ "$TARGET" != production ] || gated "$DOMAIN" pin || leak=$?
            if [ "$leak" -ne 2 ]; then
              echo "::warning::ceiling: the account has made 60 or more deployments in the last 24 hours, so the rest of the day is left to the products. Nothing is deployed; the last Roadmap stands."
              exit 0
            fi
            echo "::error::A STRANGER IS SERVED THE ROADMAP on $DOMAIN: the ceiling is passed over to put a gated Roadmap in its place."
          else
            echo "the account's deployments in the last 24 hours: under the ceiling of 60"
          fi
          # THE FUNCTION'S KEYS (#222), carried from the reviewer environment,
          # their one home, to the project before the frame is made, so the new
          # deployment reads with them: BOARD_READ_TOKEN, a read-only GitHub
          # token, and OPENROUTER_KEY when the environment holds it. Each goes
          # from a file made here, never on a command line or into this log,
          # and is stored sensitive, which the host never gives back. One that
          # is not stored deploys nothing.
          for k in BOARD_READ_TOKEN OPENROUTER_KEY; do
            [ -n "${!k:-}" ] || continue
            ( umask 077; jq -n --arg k "$k" '{key: $k, value: $ENV[$k], type: "sensitive", target: ["production", "preview"]}' \
              > "$RUNNER_TEMP/key.json" )
            code=$(v -X POST "https://api.vercel.com/v10/projects/$PROJECT/env?$q&upsert=true" -d @"$RUNNER_TEMP/key.json" \
              -o /dev/null -w '%{http_code}') || code=000
            rm -f "$RUNNER_TEMP/key.json"
            [[ "$code" =~ ^2 ]] || { echo "::error::KEY NOT STORED: HTTP $code storing $k on the project. Nothing is deployed; the last Roadmap stands."; exit 1; }
            echo "stored on the project: $k"
          done
          # EVERY RED PUTS THINGS BACK, by how far the deploy got: a preview
          # still building is cancelled; a ready one that did not pass its smoke
          # is deleted; once promoted, what the domain served before is
          # promoted back, the host must accept it, and the domain must serve
          # it again within three minutes. Each refusal is red in its own words.
          id=""
          copy=""
          state=""
          phase=none
          ok=no
          cleanup() {
            { [ "$ok" = yes ] || [ "$phase" = none ]; } && return 0
            local code
            case "$phase" in
              building)
                case "$state" in ERROR|CANCELED) exit 1 ;; esac
                code=$(v -X PATCH "https://api.vercel.com/v12/deployments/$id/cancel?$q" -o /dev/null -w '%{http_code}') || code=000
                [[ "$code" =~ ^2 ]] || { echo "::error::CANCEL REFUSED: HTTP $code cancelling $id. It is a preview and was never given the domain."; exit 1; }
                echo "cancelled: $id"
                exit 1 ;;
              preview)
                code=$(v -X DELETE "https://api.vercel.com/v13/deployments/$id?$q" -o /dev/null -w '%{http_code}') || code=000
                [[ "$code" =~ ^2 ]] || { echo "::error::DELETE REFUSED: HTTP $code deleting $id. It is a preview and was never given the domain."; exit 1; }
                echo "deleted: $id"
                exit 1 ;;
              promoted)
                echo "::error::not confirmed live and gated; putting $before back"
                # A copy still building would take the domain once ready, so it
                # is cancelled, and the cancel is read back: a copy that went
                # READY first is put back below like any other (#139's read, 2).
                if [ -n "$copy" ]; then
                  state=$(copied)
                  case "$state" in
                    READY|ERROR|CANCELED) ;;
                    *) code=$(v -X PATCH "https://api.vercel.com/v12/deployments/$copy/cancel?$q" -o /dev/null -w '%{http_code}') || code=000
                       for _ in 1 2 3 4 5 6; do
                         state=$(copied)
                         case "$state" in READY|ERROR|CANCELED) break ;; esac
                         sleep 5
                       done
                       case "$state" in
                         READY) ;;
                         ERROR|CANCELED) echo "cancelled: $copy, $state" ;;
                         *) echo "::error::CANCEL $([[ "$code" =~ ^2 ]] && echo UNCONFIRMED || echo "REFUSED: HTTP $code"): $copy is ${state:-unread}, and takes the domain once ready."; exit 1 ;;
                       esac ;;
                  esac
                  # A READY copy may take the domain a moment after: it is
                  # given a minute to, so the put-back comes after it.
                  if [ "$state" = READY ]; then
                    for _ in 1 2 3 4 5 6; do serves "$copy" && break; sleep 10; done
                  fi
                fi
                code=$(v -X POST "https://api.vercel.com/v10/projects/$PROJECT/promote/$before?$q" -o /dev/null -w '%{http_code}') || code=000
                # The host answers 409 to a promote of what the domain still serves (run 36997804844).
                [[ "$code" =~ ^2 ]] || { [ "$code" = 409 ] && serves "$before"; } || { echo "::error::ROLLBACK REFUSED: HTTP $code promoting $before. The domain may serve an unconfirmed Roadmap."; exit 1; }
                local back=$(( $(date +%s) + 180 ))
                while [ "$(date +%s)" -lt "$back" ]; do
                  serves "$before" && { echo "rolled back: $DOMAIN serves $before"; exit 1; }
                  sleep 10
                done
                echo "::error::ROLLBACK UNCONFIRMED: $DOMAIN does not serve $before after three minutes."
                exit 1 ;;
            esac
          }
          trap cleanup EXIT
          # The files are sent through the API: no Git metadata, so the host
          # cannot read this as an integration deploy (library/deploy.md). No
          # target: a preview, which the host never gives the domain.
          jq -n --arg p "$PROJECT" --arg h "$BOARD_HASH" \
            --rawfile build "$site/api/build.py" --rawfile mw "$site/middleware.js" \
            --rawfile robots "$site/robots.txt" --rawfile vj "$site/vercel.json" \
            '{name: "juku-build-board", project: $p, projectSettings: {framework: null},
              files: [{file: "api/build.py", data: $build}, {file: "middleware.js", data: $mw},
                      {file: "robots.txt", data: $robots}, {file: "vercel.json", data: $vj},
                      {file: "board.sha", data: $h}]}' > "$RUNNER_TEMP/deploy.json"
          rm -rf "$site"
          made=$(v -X POST "https://api.vercel.com/v13/deployments?$q&skipAutoDetectionConfirmation=1" -d @"$RUNNER_TEMP/deploy.json" || true)
          rm -f "$RUNNER_TEMP/deploy.json"
          id=$(printf '%s' "$made" | jq -r '.id // empty' 2>/dev/null || true)
          [[ "$id" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "::error::the host did not confirm the deployment: $(printf '%s' "$made" | jq -r '.error.code // "no code"' 2>/dev/null || echo "no answer")"; exit 1; }
          phase=building
          echo "deployment: $id (a preview)"
          while [ "$(date +%s)" -lt "$by" ]; do
            state=$(v "https://api.vercel.com/v13/deployments/$id?$q" 2>/dev/null | jq -r '.readyState // empty' 2>/dev/null || true)
            case "$state" in READY|ERROR|CANCELED) break ;; esac
            sleep 5
          done
          [ "$state" = READY ] || { echo "::error::the deployment ended ${state:-unknown} by minute $limit of the job, not READY"; exit 1; }
          phase=preview
          # THE PREVIEW, SMOKED AS A STRANGER (#117's second read, 2): the
          # host's sign-in wall or the PIN screen, never the board. Its address
          # is printed only after.
          host=$(v "https://api.vercel.com/v13/deployments/$id?$q" 2>/dev/null | jq -r '.url // empty' 2>/dev/null || true)
          [[ "$host" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::the host named no address for $id"; exit 1; }
          g=1
          while [ "$(date +%s)" -lt "$by" ]; do
            gated "$host" wall && g=0 || g=$?
            [ "$g" -eq 1 ] || break
            sleep 10
          done
          [ "$g" -ne 2 ] || { echo "::error::A STRANGER WAS SERVED THE ROADMAP at the preview $id"; exit 1; }
          [ "$g" -eq 0 ] || { echo "::error::the preview $id showed a stranger neither the sign-in wall nor the PIN screen by minute $limit of the job"; exit 1; }
          if [ "$TARGET" = preview ]; then
            ok=yes
            # The smoked preview takes the fixed name; the host moves it off the last.
            # The name is smoked as a stranger like the preview's own host before it
            # is handed over; the Roadmap shown there deletes the preview (#136's read, 3).
            code=$(v -X POST "https://api.vercel.com/v2/deployments/$id/aliases?$q" -d "{\"alias\":\"$NEXT\"}" -o /dev/null -w '%{http_code}') || code=000
            if [[ "$code" =~ ^2 ]]; then
              g=1
              for _ in 1 2 3 4 5 6; do
                gated "$NEXT" wall && g=0 || g=$?
                [ "$g" -eq 1 ] || break
                sleep 5
              done
              if [ "$g" -eq 2 ]; then ok=no; echo "::error::A STRANGER WAS SERVED THE ROADMAP at the fixed address $NEXT"; exit 1; fi
              if [ "$g" -eq 0 ]; then echo "preview ready at the fixed address: https://$NEXT"
              else echo "::warning::the fixed address did not show a stranger the sign-in wall or the PIN screen; use this preview's own"; fi
            else echo "::warning::the fixed preview address was refused (HTTP $code); this preview has only its own"; fi
            echo "preview ready, and a stranger gets the sign-in wall or the PIN screen: https://$host"
            exit 0
          fi
          # PROMOTED BY THIS STEP, NEVER BY THE HOST (#117's second read, 1).
          # The host will not point the domain at a preview (run 36997804844:
          # 422), so the smoked preview is copied to production, as the host's
          # own CLI promotes one: its files, not a rebuild of main (library/deploy.md).
          # Armed before the call: a copy asked for may still land.
          phase=promoted
          made=$(v -X POST "https://api.vercel.com/v13/deployments?$q" \
            -d "{\"deploymentId\":\"$id\",\"name\":\"juku-build-board\",\"target\":\"production\",\"meta\":{\"action\":\"promote\"}}" || true)
          copy=$(printf '%s' "$made" | jq -r '.id // empty' 2>/dev/null || true)
          [[ "$copy" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo "::error::PROMOTE REFUSED: no production copy of $id: $(printf '%s' "$made" | jq -r '.error.code // "no code"' 2>/dev/null || echo "no answer"); one asked for may still land"; exit 1; }
          echo "production copy: $copy"
          # THE SMOKE: the domain serves this deployment, and to a stranger
          # the PIN screen and nothing of the board. The edge follows the
          # control plane by a little, so a missing answer is asked again until
          # the deadline; the Roadmap seen by a stranger is never asked again.
          g=1
          while [ "$(date +%s)" -lt "$by" ]; do
            gated "$DOMAIN" pin && g=0 || g=$?
            [ "$g" -ne 2 ] || break
            if [ "$g" -eq 0 ] && serves "$copy"; then
              ok=yes
              echo "live: $copy, the copy of $id, on $DOMAIN, the PIN screen alone to a stranger"
              exit 0
            fi
            sleep 10
          done
          [ "$g" -ne 2 ] || { echo "::error::A STRANGER WAS SERVED THE ROADMAP on $DOMAIN"; exit 1; }
          echo "::error::$DOMAIN did not serve $copy, gated, by minute $limit of the job"
          exit 1
