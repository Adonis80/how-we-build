name: Ask for product reads

# THE ASKER (decision 0013, #148): for each product the README lists, ask for a
# read of every pull request that is ready to be read, so a builder asks nobody
# and no token of a product's carries the right to start a workflow here. What
# is ready, and what is not, is product-reads/reads.py's to say (the ready mark,
# the product's own check, not read yet), and review-product.yml asks it again
# before it pays for anything, so this file cannot buy a read the reviewer
# would refuse.
#
# THE TIMER (the Chairman's ruling of 4 October 2026: "I agree with your
# recommended option A. One timer in the rulebook only. Proceed to build."). This
# is the one scheduled workflow in this repository and the only one under this
# rulebook: every ten minutes it looks at each listed product and asks for the
# reads that are ready. It lifts his 10 September stop on clocks for this file
# only (library/carries-sessions.md): no product gets a timer, a token or a
# schedule, and a session still has no clock. Started by a person it only says
# what it would ask, unless told to ask.
#
# WHY IT CAN COME BACK EVERY TEN MINUTES. A commit is asked about once, whatever
# became of the run (product-reads/ask.py reads review-product.yml's own run
# names). A read that began and never finished, or ended without a verdict, is
# nobody's to retry but a builder's, with `again`. A question GitHub does not
# answer is a red run, never "nothing is ready". review-gate.py holds all three
# against a made-up product over seven timed runs, and holds this file to one
# schedule, every ten minutes, and nothing else; the clock is on only because
# that passes. GitHub starts a schedule when it can, so a read may wait longer.
#
# WHAT IT HOLDS. The App's key, behind the same door as the reviewer, so it runs
# on main alone. Per product a token scoped to that one repository, with contents,
# pull requests and checks READ alone, whose grant and reach are checked before
# it is used and which is revoked after. This repository's own token with
# `actions: write`, handed to the one program that starts review-product.yml, and
# nothing of the App's key. The ask names the product, a pull request's number
# and a commit; the log shows those and counts, and nothing a product holds.
#
# IT RUNS, AND IS HELD. review-gate.py holds each line of this file against cases,
# and product-reads/ask.py runs its rules against a made-up product; the live
# ticks are its runs on main (run 37911136877, 9 October 2026, the latest).
#
# OFF THE BUSY MINUTES (9 October 2026, in decision 0018's change). On "*/10" it ran four times on 8
# October (UTC; runs 37720778799 to 37853290641), not every ten minutes: GitHub
# delays and drops scheduled runs on round minutes, when everyone's schedules
# fire. Minute 7 and every ten after is the same clock, still the one schedule
# (his ruling, 4 October 2026).
#
# THE CLOCK INSIDE THE TICK (9 October 2026). Minute 7 did not mend it: the
# schedule had fired 7 times since its first tick (7 October, 23:48 UTC, run
# 37704348679), 3 to 7 hours apart, and none from 09:25 to 17:08 UTC on 9
# October, minute 7 in place since 15:58. GitHub runs a schedule when it can
# and drops what it cannot, and no cron line changes that. So a tick that lands keeps the ruling itself: it
# looks, then every ten minutes again, LOOKS times in all (32, about five
# hours, inside the job's limit), and a newer run waiting its turn, a tick or
# a person's, takes over at its next look. One tick in five hours keeps the
# ten-minute clock; a person's run looks once. On a public repository the
# runner's minutes cost nothing. Still the one schedule, and nothing else.
#
# THE RELAY (#202, agreed with the consultant 13 October 2026). The tick that
# lands still leaves hours between its last look and the next tick, so every
# asking run (a tick, a relay, a person's run told to ask) starts its own
# successor at its last look, unless an asking run on main is already waiting
# its turn: GitHub keeps one waiting run in the group, and whichever survives
# relays in its turn. A dry run asks nothing, waits in a group of its own, and
# never yields or relays. Only the relay's own starts count, by their own input
# and their own run name, against a cap of 12 a UTC day (about 5 are needed),
# counted afresh from GitHub's whole list just before each start, cancelled
# ones included; a tick or a person's start neither counts nor resets it. A
# count that cannot be read, a cap reached, or a start refused is a red run
# that says which, and the schedule stays as the restart. Ten minutes is the
# target, not a promise: a runner outage or the cap can still leave a gap.

run-name: "${{ github.event_name == 'schedule' && 'Ask for product reads: timed' || !inputs.dispatch && 'Ask for product reads: dry run' || inputs.relay && 'Ask for product reads: relay' || 'Ask for product reads: asking' }}"

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
    inputs:
      dispatch:
        description: Ask for the reads it finds. False, it only says what it would ask.
        required: false
        type: boolean
        default: false
      relay:
        description: Set by the asker alone, on the successor it starts. Counted against the day's cap; a person leaves it off.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.dispatch) && 'ask-product-reads' || 'ask-product-reads-dry' }}
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    # THE DOOR, as the reviewer's: without this line the App's key is readable
    # from any branch. review-gate.py refuses a build that loses it.
    environment: reviewer
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Look at each product and ask
        env:
          APP_ID: ${{ secrets.REVIEWER_APP_ID }}
          APP_KEY: ${{ secrets.REVIEWER_APP_KEY }}
          GH_TOKEN: ${{ github.token }}
          DISPATCH: ${{ github.event_name == 'schedule' && 'true' || inputs.dispatch }}
          LOOKS: ${{ (github.event_name == 'schedule' || (inputs.dispatch && inputs.relay)) && '32' || '1' }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ] || [ -z "${APP_KEY:-}" ]; then
            echo "::error::No badge: the reviewer environment holds no REVIEWER_APP_ID or REVIEWER_APP_KEY. Nothing is asked."
            exit 1
          fi
          [[ "$DISPATCH" =~ ^(true|false)$ ]] || { echo "::error::dispatch is true or false"; exit 1; }
          flag=""
          if [ "$DISPATCH" = "true" ]; then flag="--dispatch"; fi
          # The list is read whole before anything is asked, so a README that cannot
          # be read is a red job and not a loop that runs no times, and the log says why
          # (the README is public, so its refusal can be printed).
          products=$(python3 -I product-reads/reads.py list README.md) || { echo "::error::the README's product list could not be read: $products"; exit 1; }
          [ -n "$products" ] || { echo "::error::the README lists no product"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/reviewer.pem"
          tok=""
          # Every request has a time limit, and a product's token is never left live.
          revoke() { [ -z "$tok" ] || curl -sS --max-time 20 -o /dev/null -X DELETE -H "Authorization: token $tok" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/installation/token" || true; tok=""; }
          trap 'revoke; rm -f "$key" "$RUNNER_TEMP/mint.json"' EXIT
          looks=${LOOKS:-1}
          [[ "$looks" =~ ^[1-9][0-9]?$ ]] && [ "$looks" -le 32 ] || { echo "::error::looks is 1 to 32"; exit 1; }
          look=0
          # Each look is the whole of what follows, at this indentation so its lines
          # stay the ones review-gate.py holds. A RED LOOK IS REMEMBERED, NEVER THE END
          # (12 October 2026, run 38229766003): the tick died at its 20th look because one
          # product's token did not mint once, Hemz-OS#150's verify passed fifteen minutes
          # later, and no tick fired again for an hour, so nobody asked. One product's
          # trouble, or one answer GitHub did not give, stops no other product being
          # asked: the look goes on, the run looks again, and it ends red after its last
          # look, naming every look that was red.
          red=0
          # THE RUNS THAT CARRY THE CLOCK (#202): an asking run on main waiting its turn,
          # a tick, a relay or a person's run told to ask. A dry run waits in a group of
          # its own and is never one, so it never makes an asking run yield.
          waiting() { timeout 30 gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ask-product-reads.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .head_branch == \"main\" and (.display_title | test(\"^Ask for product reads: (timed|asking|relay)\$\")) and (.status == \"queued\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\"))] | length"; }
          yielded=0
          quick=0
          while [ "$look" -lt "$looks" ]; do
          look=$((look + 1))
          if [ "$look" -gt 1 ]; then
            # THE QUICK LOOK (D, the Chairman's word of 21 October 2026: the reviewer
            # starts on the event). No product holds a token that starts anything here
            # (decision 0013), so the event is watched for: when the last look saw a ready
            # mark whose product check was still running, ask.py left a note, and the next
            # look comes a minute later rather than ten, so a read starts about a minute
            # after the check passes. Twenty quick looks a run at most, inside the 32.
            if [ -s "$RUNNER_TEMP/ask-pending" ] && [ "$quick" -lt 20 ]; then
              quick=$((quick + 1))
              sleep 60
            else
            sleep 600
            fi
            # A newer asking run waiting its turn takes over, so a person's run never waits
            # behind this one. A list that does not come is no newer run: look again.
            if [ "$DISPATCH" = "true" ]; then
              pending=$(waiting) || pending=0
              if [[ "$pending" =~ ^[1-9][0-9]*$ ]]; then echo "a newer run is waiting, and takes over"; yielded=1; break; fi
            fi
          fi
          echo "look $look of $looks"
          : > "$RUNNER_TEMP/ask-pending"
          # The App's JWT lives nine minutes, so each look signs its own.
          printf '%s\n' "$APP_KEY" > "$key"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          hdr=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          pl=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64url)
          sig=$(printf '%s' "$hdr.$pl" | openssl dgst -binary -sha256 -sign "$key" | b64url)
          jwt="$hdr.$pl.$sig"
          rm -f "$key"
          failed=0
          # EVERY LOOKUP BELOW THAT CAN FAIL ENDS IN `|| x=""` OR A `continue`, never in the
          # shell's own exit: under `set -e` and `pipefail` one product's timeout would end
          # the loop, and the products after it would not be looked at. The job is red for it
          # at the end, and says which.
          for REPO in $products; do
            inst=$(curl -sS --max-time 20 -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/installation" | jq -r '.id // empty') || inst=""
            [ -n "$inst" ] || { echo "::error::the App is not installed on $REPO, or GitHub did not answer"; failed=1; continue; }
            # ONE PRODUCT, AND READ ALONE: what the asker looks at is its open pull
            # requests, their commits and their check runs, and it writes nothing.
            body=$(jq -cn --arg r "${REPO#*/}" '{repositories: [$r], permissions: {contents: "read", pull_requests: "read", checks: "read"}}')
            curl -sS --max-time 20 -X POST -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/app/installations/$inst/access_tokens" -d "$body" > "$RUNNER_TEMP/mint.json" || : > "$RUNNER_TEMP/mint.json"
            tok=$(jq -r '.token // empty' "$RUNNER_TEMP/mint.json") || tok=""
            [ -n "$tok" ] || { echo "::error::the App would not mint a token scoped to $REPO: $(jq -r '.message // "no message"' "$RUNNER_TEMP/mint.json")"; failed=1; continue; }
            echo "::add-mask::$tok"
            want='{"checks":"read","contents":"read","pull_requests":"read"}'
            granted=$(jq -cS '(.permissions // {}) | del(.metadata)' "$RUNNER_TEMP/mint.json") || granted=""
            if [ "$granted" != "$want" ]; then
              revoke
              echo "::error::SCOPE WRONG: the token was granted $granted, not $want. Revoked; $REPO was not looked at."
              failed=1
              continue
            fi
            reach=$(curl -sS --max-time 20 -H "Authorization: token $tok" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/installation/repositories" | jq -r '[.repositories[].full_name] | join(",")') || reach=""
            if [ "$reach" != "$REPO" ]; then
              revoke
              echo "::error::SCOPE WRONG: the token reached [$reach], not $REPO alone. Revoked; $REPO was not looked at."
              failed=1
              continue
            fi
            # The App's key and id stay out of the program's hands; it is given the
            # product's token, the App's id as a number, and this repository's token.
            rc=0
            env -u APP_KEY -u APP_ID PRODUCT_TOKEN="$tok" REVIEWER_APP_ID="$APP_ID" python3 -I product-reads/ask.py "$REPO" $flag || rc=$?
            revoke
            [ "$rc" -eq 0 ] || failed=1
          done
          # One product's trouble does not stop the others being looked at, nor the
          # next look; and it does not go unsaid: the job is red at the end.
          [ "$failed" -eq 0 ] || { red=1; echo "::error::look $look was red; looking on"; }
          done
          # THE RELAY (#202): after its last look an asking run starts its one successor,
          # unless an asking run already waits to carry the clock on. Only the relay's own
          # starts are counted, afresh, from every page of GitHub's list since midnight UTC.
          if [ "$DISPATCH" = "true" ] && [ "$yielded" -eq 0 ]; then
            pending=$(waiting) || pending=0
            if [[ "$pending" =~ ^[1-9][0-9]*$ ]]; then
              echo "an asking run is waiting its turn, and relays in its turn"
            else
              day=$(date -u +%Y-%m-%dT00:00:00Z)
              started=$(timeout 60 gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ask-product-reads.yml/runs?event=workflow_dispatch&created=%3E%3D$day&per_page=100" \
                --jq "[.workflow_runs[] | select(.display_title == \"Ask for product reads: relay\" and .created_at >= \"$day\")] | length" | awk '{ n += $1 } END { print n + 0 }') || started=""
              if ! [[ "$started" =~ ^[0-9]+$ ]]; then
                red=1; echo "::error::relay refused: GitHub did not give the count of today's relay starts. No successor; the schedule stays as the restart."
              elif [ "$started" -ge 12 ]; then
                red=1; echo "::error::relay refused: $started relay starts today (UTC), and the cap is 12. No successor; the schedule stays as the restart."
              elif timeout 30 gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/ask-product-reads.yml/dispatches" \
                  -f ref=main -f 'inputs[dispatch]=true' -f 'inputs[relay]=true' > /dev/null; then
                echo "relayed: a successor is started, $((started + 1)) of 12 today (UTC)"
              else
                red=1; echo "::error::relay refused: GitHub would not start the successor. No successor; the schedule stays as the restart."
              fi
            fi
          fi
          [ "$red" -eq 0 ]
