name: Door

# THE STANDING PROOF THAT THE BADGE CANNOT BE FORGED.
#
# The reviewer's independence rests on one claim: the `reviewer` environment
# holds the App's private key, and a workflow run whose ref is a branch cannot
# read it. If that is false, any branch mints an installation token, writes
# itself a clean check run, and the whole gate is decoration.
#
# GitHub documents the rule — a job referencing an environment must satisfy its
# protection rules before it runs or reads its secrets — but documentation is not
# this repository's standard. #38 put eleven loosenings through CI and proved each
# one red before trusting the rule it protected. This is that, for the one claim
# everything else stands on.
#
# HOW TO RUN IT. Push a branch named `proof/door-<anything>`, or dispatch this
# workflow against a branch. It runs two jobs, and the PAIR is the proof — one
# job alone proves nothing, because a job can fail for a dozen dull reasons.
#
#   control   no environment. It must RUN, and must find no REVIEWER_APP_ID,
#             because environment secrets are not ambient. This is what says the
#             branch could run a job at all, and that the key is not simply
#             lying around outside the door.
#   door      the same job behind `environment: reviewer`. On a branch it is
#             REFUSED BEFORE IT STARTS — no steps, no log, a job that completes
#             in about a second — because the environment admits `main` alone.
#             On main it runs and reads the key.
#
# So on a branch the run is red, and red in exactly one place. A control that
# fails means something unrelated is broken and the run proves nothing. A door
# job that RUNS on a branch means the door is open and the badge is worthless:
# the deployment branch policy has been widened or removed, and nothing should
# be merged until it is back.
#
# GIVE THE PROOF BRANCH A COMMIT OF ITS OWN. Check runs attach to a SHA, so a
# proof branch pushed at the same commit as a pull request's head hangs its red
# `door` row on that pull request, where it looks like a broken build for ever.
# `check.sh` is the only required check so nothing is blocked, but a permanently
# red row is how a real one comes to be scrolled past. One extra commit on the
# branch — a line in this comment will do — keeps the proof's runs on their own
# SHA. Learned on #42, which did exactly this to itself.
#
# Record the run id on the pull request that claims the door works, because a
# claim about a protection rule that nobody has watched refuse anything is
# exactly the kind of claim #34 spent ten rounds refusing.
#
# It fires on nothing else on purpose. `pull_request` would make it red on every
# pull request from a branch, which is the correct result presented as a
# permanent failure, and review-gate.py refuses that trigger here.

on:
  workflow_dispatch:
  push:
    # A branch prefix nothing else uses, so the proof is a deliberate act and
    # never a side effect of ordinary work.
    branches: ['proof/door-*']

permissions:
  contents: read

jobs:
  # The control. Same runner, same ref, same reach for the same secret — and no
  # environment. Without it a red `door` job says only "something went wrong".
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: reach for the key with no environment
        env:
          APP_ID: ${{ secrets.REVIEWER_APP_ID }}
        run: |
          set -euo pipefail
          echo "ref: $GITHUB_REF   sha: $GITHUB_SHA"
          echo "this job ran, so this ref can run jobs and reach secrets it is entitled to."
          if [ -n "${APP_ID:-}" ]; then
            echo "LEAK: REVIEWER_APP_ID is readable with no environment named."
            echo "It is supposed to be an environment secret, reachable only from a job"
            echo "that names the environment and satisfies its branch policy."
            exit 1
          fi
          echo "and it found no REVIEWER_APP_ID, which is right: environment secrets are"
          echo "not ambient. Whatever the door job does next is about the door alone."

  door:
    runs-on: ubuntu-latest
    # The line under test. On any ref but main, GitHub refuses this job here,
    # before a step runs and before a secret is decrypted.
    environment: reviewer
    timeout-minutes: 5
    steps:
      - name: reach for the key
        env:
          APP_ID: ${{ secrets.REVIEWER_APP_ID }}
        run: |
          set -euo pipefail
          echo "ref: $GITHUB_REF   sha: $GITHUB_SHA"
          if [ -z "${APP_ID:-}" ]; then
            echo "This job ran, so the door admitted this ref — but the environment"
            echo "held no REVIEWER_APP_ID. That is a wiring fault, not a proof."
            exit 1
          fi
          # Never the value. This repository's logs are public, and a guard that
          # echoes what it holds leaks it on the one day it fires.
          echo "read ${#APP_ID} characters from the '$GITHUB_REF_NAME' ref."
          case "$GITHUB_REF" in
            refs/heads/main) echo "main may read it. The door is where it should be." ;;
            *) echo "DOOR OPEN: a branch read the environment. The badge can be forged."; exit 1 ;;
          esac

      # THE REVIEWER'S TOKEN, SCOPED, PROVED HERE BEFORE review.yml RELIES ON IT.
      # review.yml mints its installation token with no body, so the token reaches
      # every repository the App is installed on — Hemz OS too, since #47 — in a
      # job that also runs the reviewer's tool. It should reach this repository
      # alone and do one thing: write check runs. That request can only be proved
      # where the key is, which is behind this door on main; and review.yml runs
      # only from main, so a mint that failed there would stop every read, the
      # fix's included. So it is proved here first, where a failure stops
      # nothing: dispatch this workflow on main and read this step. Until the
      # pull request that follows lands, review.yml still mints unscoped: this
      # step is the rehearsal for that change, and it is only worth anything
      # while it signs and finds the installation exactly as review.yml does,
      # which review-gate.py holds line for line. It never runs on a branch: the
      # door refuses the whole job there, and the step above stops it if not.
      # The token it mints is revoked before the step ends, and nothing is
      # printed but names.
      - name: mint the reviewer's token scoped, as review.yml will, and prove its reach
        env:
          APP_ID: ${{ secrets.REVIEWER_APP_ID }}
          APP_KEY: ${{ secrets.REVIEWER_APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/reviewer.pem"
          trap 'rm -f "$key" "$RUNNER_TEMP/mint.json"' EXIT
          printf '%s\n' "$APP_KEY" > "$key"
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          hdr=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          pl=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64url)
          sig=$(printf '%s' "$hdr.$pl" | openssl dgst -binary -sha256 -sign "$key" | b64url)
          jwt="$hdr.$pl.$sig"
          rm -f "$key"
          inst=$(curl -sS -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/installation" | jq -r '.id // empty')
          [ -n "$inst" ] || { echo "the App is not installed on $GITHUB_REPOSITORY"; exit 1; }
          body=$(jq -cn --arg r "${GITHUB_REPOSITORY#*/}" '{repositories: [$r], permissions: {checks: "write"}}')
          echo "asking for: $body"
          curl -sS -X POST -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/app/installations/$inst/access_tokens" -d "$body" > "$RUNNER_TEMP/mint.json"
          tok=$(jq -r '.token // empty' "$RUNNER_TEMP/mint.json")
          if [ -z "$tok" ]; then
            echo "REFUSED: the scoped mint was not granted — review.yml must not ask for it."
            jq -r '.message // "no message"' "$RUNNER_TEMP/mint.json"
            exit 1
          fi
          echo "::add-mask::$tok"
          echo "granted permissions: $(jq -c '.permissions' "$RUNNER_TEMP/mint.json")"
          rm -f "$RUNNER_TEMP/mint.json"
          reach=$(curl -sS -H "Authorization: token $tok" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/installation/repositories" | jq -r '[.repositories[].full_name] | join(",")')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: token $tok" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/installation/token")
          echo "the scoped token reached: $reach — and was revoked ($code)"
          [ "$reach" = "$GITHUB_REPOSITORY" ] || { echo "SCOPE WRONG: it reached more, or less, than this repository."; exit 1; }
          [ "$code" = "204" ] || { echo "the token was not revoked"; exit 1; }
          echo "PROVED: this request mints a token that reaches $GITHUB_REPOSITORY alone and can write check runs."
