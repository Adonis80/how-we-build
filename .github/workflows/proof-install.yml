name: proof-install
# A throwaway proof for the pull request that pins the reviewer's tool. It runs
# the install line exactly as review.yml will, on the same runner image, with
# no secret in reach, then holds the result against every flag review.yml
# passes. Removed from this branch once it has run.
on:
  push:
    branches: ['proof/diff-against-main']
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: The install line, exactly as review.yml will run it
        run: npm install -g @anthropic-ai/claude-code@2.1.280
      - name: The version, and every flag review.yml passes
        run: |
          set -euo pipefail
          node --version
          claude --version
          claude --version | grep -q '^2\.1\.280 '
          claude --help > /tmp/help.txt
          for f in --model --effort --tools --restricted --strict-mcp-config --disable-slash-commands --no-session-persistence --permission-prompts --output-format --json-schema --system-prompt; do
            grep -q -- "$f" /tmp/help.txt || { echo "missing: $f"; exit 1; }
            echo "has $f"
          done
