name: verify

# The product's own check. A read is asked of a commit only after this passes on
# it, so nothing is paid for on work that does not even build. It starts as two
# things true of any product, and the product adds its tests and builds here as
# it grows: this file is the product's own after the first install.
#
# A READY MARK ON A DRAFT IS SAID OUT LOUD (#202): the asker leaves a draft, so a
# mark pushed to one would wait in silence. Here it fails, saying why; taking the
# pull request out of draft runs this again on the same commit, which then passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: A ready mark is not left on a draft
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$DRAFT" = "true" ] || exit 0
          message=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)
          if printf '%s\n' "$message" | tr -d '\r' | grep -qx 'Review-Ready: yes'; then
            echo "::error::This pull request is a draft, so its ready mark is never read. Take it out of draft: verify runs again on the same commit, and the read is asked once it passes."
            exit 1
          fi
      - name: The gate still means what the rulebook's does
        run: python3 review-gate.py --selftest
      - name: AGENTS.md carries what every product carries
        run: |
          python3 - <<'PY'
          import re, sys
          text = open("AGENTS.md", encoding="utf-8").read()
          first = text.splitlines()[0] if text.strip() else ""
          bad = []
          if not first.startswith("Rulebook: https://github.com/Adonis80/how-we-build"):
              bad.append("AGENTS.md must begin with the Rulebook line")
          if not re.search(r"(?m)^## Review guidelines\s*$", text):
              bad.append("AGENTS.md must hold a `## Review guidelines` section")
          if len(text.split()) >= 500:
              bad.append("AGENTS.md must stay under 500 words")
          for b in bad:
              print("::error::" + b)
          sys.exit(1 if bad else 0)
          PY
