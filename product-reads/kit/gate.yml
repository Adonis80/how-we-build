name: gate

# Green only on a commit the independent reviewer has read clean. The reviewer's
# verdict is a check run signed by its App; review-gate.py reads that and nothing
# else. A push turns this red until a read lands on the new commit, and wake.yml
# asks it again when one does. Copied from the rulebook's kit and changed there.
#
# FROM MAIN. `pull_request_target` runs main's copy of this file, and the checkout
# below takes main's tree, so main's review-gate.py answers. On `pull_request` a
# branch's own copies ran, and a branch could turn its own gate green with no
# read (Adonis80/fixed#1; how-we-build#265). The trigger is safe here because
# this job never checks out or runs anything the pull request wrote, and holds no
# secret and nothing that writes: it asks GitHub about one commit and exits.
# The rulebook's review-gate.py refuses a kit that checks out the head.

on:
  pull_request_target:
    # Into main alone: a pull request opened against another branch would run
    # that branch's gate, and a retarget fires only `edited`, never run here.
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # main's tree, never the pull request's: no `ref:`.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 review-gate.py "$REPO" "$HEAD_SHA" "$GH_TOKEN"
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
